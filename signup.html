<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Sign Up | Skatersthinkph </title>
    <link rel="stylesheet" href="style.css">
    <style>
        .navbar {
            background-color: #17223a;
            font-family: Times New Roman;
            padding-right: 15px;
            padding-left: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .menu {
            display: flex;
            align-items: center;
            gap: 20px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .logo {
            font-size: 40px;
            font-weight: 600;
            color: rgb(255, 255, 255);
            display: inline-block
        }

        li {
            list-style: none;
            display: inline-block;

        }

        li a {
            color: rgb(255, 255, 255);
            font-size: 20px;
            font-weight: bold;
            margin-right: 25px;
        }

        button {
            background-color: black;
            margin-left: 10px;
            border-radius: 10px;
            padding: 10px;
            width: 90px;
        }

        button a {
            color: white;
            font-weight: bold;
            font-size: 15px;
            text-decoration: none;
        }

        .form-container {
            font-family: Times New Roman;
            background-color: darkblue;
            border-radius: 15px;
            padding: 40px;
            width: 350px;
            margin: 80px auto;
            color: yellow;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-container h2 {
            text-align: center;
            margin: 0 0 20px 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group input {
            padding: 10px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
            font-family: sans-serif;
        }

        .form-submit {
            background-color: yellow;
            color: darkblue;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            margin-left: 0;
            width: 100%;
        }

        .checkbox-group {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input {
            width: auto;
            margin: 0;
        }

        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                padding: 20px 15px;
                gap: 15px;
            }

            .menu {
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
            }

            li {
                margin-bottom: 5px;
            }

            li a {
                margin-right: 15px;
                font-size: 16px;
            }

            button {
                margin: 5px;
                width: auto;
                min-width: 110px;
                padding: 12px 15px;
            }

            button a {
                text-decoration: none;
            }

            .form-container {
                width: 90%;
                margin: 30px auto;
                padding: 30px 20px;
                box-sizing: border-box;
            }

            .form-group input {
                box-sizing: border-box;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="logo">Skatersthinkph
        </div>
        <div class="search-container">
            <input type="text" placeholder="Search..." class="search-bar">
        </div>
        <ul class="menu">
            <li> <a href="index.html">Home</a></li>
            <li><a href="projects.html"> Browse Projects</a></li>
            <li><a href="#">Contact Us</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="tos.html">Terms of Service</a></li>
            <button><a href="publish.html">Publish</a></button>
            <button><a href="signup.html">Sign Up</a></button>
            <button><a href="#">Sign In</a></button>
        </ul>
    </nav>

    <div class="form-container">
        <h2>Create an Account</h2>
        <form id="signup-form" onsubmit="handleSignup(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter Username" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter Email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter Password" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter Phone Number">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="tos" required>
                <label for="tos">I agree to the <a href="tos.html" style="color:white;">Terms of Service</a></label>
            </div>
            <div class="form-group">
                <button type="submit" class="form-submit">Sign Up</button>
            </div>
        </form>
    </div>

    <script>
        function handleSignup(event) {
            event.preventDefault(); // Prevent form from refreshing the page
            window.location.href = 'profile.html'; // Redirect to the profile page
        }
    </script>

</body>

</html>
