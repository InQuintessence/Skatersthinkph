<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Sign Up | Skatersthinkph </title>
    <link rel="stylesheet" href="style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        .navbar {
            background-color: #EAE6B8;
            font-family: Times New Roman;
            padding-right: 15px;
            padding-left: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .menu {
            display: flex;
            align-items: center;
            gap: 20px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .logo {
            font-size: 35px;
            font-weight: 600;
            color: #36454F;
            display: inline-block
        }

        li {
            list-style: none;
            display: inline-block;

        }

        li a {
            color: #36454F;
            font-size: 18px;
            font-weight: bold;
            margin-right: 25px;
        }

        button {
            background-color: #808000;
            margin-left: 10px;
            border-radius: 10px;
            padding: 10px;
            width: 90px;
        }

        button a {
            color: white;
            font-weight: bold;
            font-size: 15px;

        }

        .form-container {
            font-family: Times New Roman;
            background-color: #c8c49a;
            border-radius: 15px;
            padding: 40px;
            width: 350px;
            margin: 80px auto;
            color: #36454F;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-container h2 {
            text-align: center;
            margin: 0 0 20px 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group input {
            padding: 10px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
            font-family: sans-serif;
        }

        .form-submit {
            background-color: #808000;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            margin-left: 0;
            width: 100%;
        }

        .checkbox-group {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input {
            width: auto;
            margin: 0;
        }

        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                padding: 20px 15px;
                gap: 15px;
            }

            .menu {
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
            }

            li {
                margin-bottom: 5px;
            }

            li a {
                margin-right: 15px;
                font-size: 16px;
            }

            button {
                margin: 5px;
                width: auto;
                min-width: 110px;
                padding: 12px 15px;
            }

            button a {
                text-decoration: none;
            }

            .form-container {
                width: 90%;
                margin: 30px auto;
                padding: 30px 20px;
                box-sizing: border-box;
            }

            .form-group input {
                box-sizing: border-box;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="logo">Skatersthinkph
        </div>
        <div class="search-container">
            <input type="text" placeholder="Search..." class="search-bar">
        </div>
        <ul class="menu">
            <li> <a href="index.html">Home</a></li>
            <li><a href="projects.html"> Browse Projects</a></li>
            <li><a href="#">Contact Us</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="tos.html">Terms of Service</a></li>
            <button><a href="publish.html">Publish</a></button>
            <button><a href="signup.html">Sign Up</a></button>
            <button><a href="#">Sign In</a></button>
        </ul>
    </nav>

    <div class="form-container">
        <h2>Create an Account</h2>

        <!-- Google Sign-In Button (direct link approach) -->
        <a href="https://accounts.google.com/o/oauth2/auth?response_type=token&client_id=YOUR_GOOGLE_CLIENT_ID&redirect_uri=YOUR_REDIRECT_URI&scope=email%20profile"
            id="google-signin-btn" style="
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: white;
            color: #36454F;
            border: 1px solid #c8c49a;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 16px;
            font-family: sans-serif;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            margin-bottom: 20px;
            width: 100%;
            box-sizing: border-box;
        " onclick="handleGoogleSignInClick(event)">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="20"
                height="20">
            Sign up with Google
        </a>

        <div style="text-align: center; color: #36454F; margin-bottom: 20px;">- OR -</div>

        <form id="signup-form" onsubmit="handleSignup(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter Username" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter Email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter Password" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter Phone Number">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="tos" required>
                <label for="tos">I agree to the <a href="tos.html" style="color: #36454F;">Terms of Service</a></label>
            </div>
            <div class="form-group">
                <button type="submit" class="form-submit">Sign Up</button>
            </div>
        </form>
    </div>

    <script>
        function handleSignup(event) {
            event.preventDefault(); // Prevent form from refreshing the page

            // Get values from manual form
            const name = document.getElementById('username').value;
            const email = document.getElementById('email').value;

            // Save to localStorage
            const userData = {
                name: name,
                email: email,
                picture: null // No picture for manual signup
            };
            localStorage.setItem('skatersthinkph_user', JSON.stringify(userData));

            window.location.href = 'profile.html'; // Redirect to the profile page
        }

        function handleGoogleLogin(response) {
            // Google sends a JWT token in response.credential
            const responsePayload = decodeJwtResponse(response.credential);

            // Extract user info
            const userData = {
                name: responsePayload.name,
                email: responsePayload.email,
                picture: responsePayload.picture
            };

            // Save to localStorage
            localStorage.setItem('skatersthinkph_user', JSON.stringify(userData));

            // Redirect to profile
            window.location.href = 'profile.html';
        }

        // Helper function to decode JWT token
        function decodeJwtResponse(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function (c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));

            return JSON.parse(jsonPayload);
        }
    </script>

</body>

</html>
